# .github/workflows/release_build.yml
# ==============================================================================
# Pipeline CI/CD Lintas Platform Otomatis untuk Aplikasi Qur'an Tarteel Hifz
#
# Tahapan Pipeline:
# 1. prepare-db-and-test : Build SQLite `quran_master.db` & jalankan `flutter test`.
# 2. build-android       : Kompilasi NDK `libwhisper.so` + build APK Android (`arm64-v8a` & `x86_64`).
# 3. build-windows       : Kompilasi MSVC `whisper.dll` + build EXE Windows x64 Portable (.zip).
# 4. build-macos         : Kompilasi Metal `libwhisper.dylib` + build bundel `.dmg` macOS Universal.
# 5. github-release      : Unggah otomatis APK, ZIP Windows, & DMG macOS ke halaman GitHub Releases
#                          setiap kali tag versi dibuat (contoh: `git tag v1.0.0 && git push --tags`).
# ==============================================================================

name: Quran Tarteel Hifz — CI & Multi-Platform Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_full_30_juz_db:
        description: 'Unduh 30 Juz penuh (114 Surah) dari Quran.com API v4'
        required: false
        default: false
        type: boolean

env:
  PROJECT_DIR: 'quran_tarteel_hifz'

jobs:
  # ============================================================================
  # JOB 1: GENERATE DATABASE SQLITE & JALANKAN UNIT TEST OTOMATIS
  # ============================================================================
  prepare-db-and-test:
    name: 1. Generate Database & Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLite3 Native Library (untuk sqflite_common_ffi di Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Jalankan Setup Proyek Flutter & Unit Test
        run: |
          chmod +x setup_flutter_project.sh
          bash setup_flutter_project.sh

          # Jika input manual meminta 30 Juz penuh, perbarui quran_master.db dengan 114 Surah penuh
          if [[ "${{ inputs.build_full_30_juz_db }}" == "true" ]]; then
            echo "Mengunduh database 30 Juz penuh (114 Surah) dari Quran.com API v4..."
            python3 build_quran_db.py --all \
              --master-out "${{ env.PROJECT_DIR }}/assets/db/quran_master.db" \
              --user-out "${{ env.PROJECT_DIR }}/assets/db/user_hifz.db"
          fi

          cd "${{ env.PROJECT_DIR }}"
          flutter pub get
          flutter test test/quran_hifz_test.dart

      - name: Unggah Aset Database `quran_master.db` untuk Job Build OS Lainnya
        uses: actions/upload-artifact@v4
        with:
          name: quran-master-db
          path: ${{ env.PROJECT_DIR }}/assets/db/quran_master.db
          retention-days: 7

  # ============================================================================
  # JOB 2: BUILD ANDROID APK (DENGAN KOMPILASI NDK `libwhisper.so`)
  # ============================================================================
  build-android:
    name: 2. Build Android APK (arm64-v8a & x86_64)
    needs: prepare-db-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Siapkan Struktur Proyek & Unduh Database Artifact
        run: |
          chmod +x setup_flutter_project.sh build_whisper_native.sh
          bash setup_flutter_project.sh

      - name: Ambil `quran_master.db` dari Job Pertama
        uses: actions/download-artifact@v4
        with:
          name: quran-master-db
          path: ${{ env.PROJECT_DIR }}/assets/db/

      - name: Kompilasi Native `libwhisper.so` via Android NDK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/$(ls -1 ${ANDROID_HOME}/ndk | sort -V | tail -n 1)"
          echo "Menggunakan ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          bash build_whisper_native.sh android

      - name: Build Release APK (Split per ABI)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Unggah Artifact APK Android
        uses: actions/upload-artifact@v4
        with:
          name: QuranTarteelHifz-Android-APKs
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk

  # ============================================================================
  # JOB 3: BUILD WINDOWS DESKTOP EXE (DENGAN KOMPILASI `whisper.dll`)
  # ============================================================================
  build-windows:
    name: 3. Build Windows Desktop (x64 EXE + whisper.dll)
    needs: prepare-db-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (Windows)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Siapkan Proyek & Kompilasi `whisper.dll`
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          chmod +x setup_flutter_project.sh build_whisper_native.sh
          bash setup_flutter_project.sh
          bash build_whisper_native.sh windows

      - name: Ambil `quran_master.db` dari Job Pertama
        uses: actions/download-artifact@v4
        with:
          name: quran-master-db
          path: ${{ env.PROJECT_DIR }}/assets/db/

      - name: Build Windows Release & Paketkan ZIP Portable
        shell: bash
        run: |
          cd "${{ env.PROJECT_DIR }}"
          flutter pub get
          flutter build windows --release

          RELEASE_DIR="build/windows/x64/runner/Release"
          cp windows/runner/*.dll "$RELEASE_DIR/" 2>/dev/null || true

          7z a -tzip "../QuranTarteelHifz-Windows-x64.zip" "./$RELEASE_DIR/*"

      - name: Unggah Artifact Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QuranTarteelHifz-Windows-x64
          path: QuranTarteelHifz-Windows-x64.zip

  # ============================================================================
  # JOB 4: BUILD MACOS UNIVERSAL DMG & PKG (DENGAN KOMPILASI METAL `libwhisper.dylib`)
  # ============================================================================
  build-macos:
    name: 4. Build macOS Universal DMG & PKG (Apple Silicon + Intel)
    needs: prepare-db-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (macOS)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Siapkan Proyek & Kompilasi Universal `libwhisper.dylib` (Metal GPU)
        run: |
          flutter config --enable-macos-desktop
          chmod +x setup_flutter_project.sh build_whisper_native.sh
          bash setup_flutter_project.sh
          bash build_whisper_native.sh macos

      - name: Ambil `quran_master.db` dari Job Pertama
        uses: actions/download-artifact@v4
        with:
          name: quran-master-db
          path: ${{ env.PROJECT_DIR }}/assets/db/

      - name: Build macOS Release & Buat Paket Installer (.dmg & .pkg)
        run: |
          cd "${{ env.PROJECT_DIR }}"
          flutter pub get
          flutter build macos --release

          APP_BUNDLE=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "ERROR: Bundle .app macOS tidak ditemukan!"
            exit 1
          fi
          echo "Target App Bundle ditemukan: $APP_BUNDLE"

          # 1. Salin dylib ke dalam Contents/Frameworks/ bundel dan perbaiki install_name
          mkdir -p "$APP_BUNDLE/Contents/Frameworks"
          cp macos/Runner/*.dylib "$APP_BUNDLE/Contents/Frameworks/" 2>/dev/null || true

          for dylib in "$APP_BUNDLE/Contents/Frameworks"/*.dylib; do
            if [ -f "$dylib" ]; then
              echo "Memperbaiki install_name dan menandatangani: $dylib"
              install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" 2>/dev/null || true
              codesign --force --sign - --timestamp=none "$dylib"
            fi
          done

          # 2. Hapus atribut karantina lokal dan lakukan deep ad-hoc code-signing pada seluruh .app
          xattr -cr "$APP_BUNDLE"
          echo "Melakukan signing ulang bundle .app secara utuh..."
          codesign --force --deep --sign - --timestamp=none "$APP_BUNDLE"

          echo "Verifikasi integritas tanda tangan digital .app:"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

          # 3. Buat Folder Staging untuk DMG (Drag & Drop + Helper 1-Klik Buka)
          DMG_STAGING="build/dmg_staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"

          APP_TARGET_NAME="Qur'an Tarteel Hifz.app"
          cp -R "$APP_BUNDLE" "$DMG_STAGING/$APP_TARGET_NAME"
          ln -s /Applications "$DMG_STAGING/Applications"

          # Tambahkan skrip helper 1-klik untuk instalasi & membuka otomatis (bypass Gatekeeper)
          HELPER_SCRIPT="$DMG_STAGING/Buka Aplikasi (Klik Dua Kali).command"
          cat > "$HELPER_SCRIPT" << 'EOF'
#!/bin/bash
DIR="$(cd "$(dirname "$0")" && pwd)"
APP_TARGET="/Applications/Qur'an Tarteel Hifz.app"

echo "=========================================================="
echo "    Pemasang Otomatis Qur'an Tarteel Hifz untuk macOS     "
echo "=========================================================="
echo ""

if [ -d "$DIR/Qur'an Tarteel Hifz.app" ]; then
  echo "[1/3] Menyalin aplikasi ke /Applications..."
  rm -rf "$APP_TARGET"
  cp -R "$DIR/Qur'an Tarteel Hifz.app" /Applications/
fi

echo "[2/3] Membuka izin keamanan macOS Gatekeeper (Unquarantine)..."
xattr -cr "$APP_TARGET" 2>/dev/null || true

echo "[3/3] Menjalankan Qur'an Tarteel Hifz..."
open "$APP_TARGET"

echo ""
echo "Instalasi Berhasil! Aplikasi telah terpasang di folder Applications."
echo "Anda dapat menutup jendela Terminal ini."
EOF
          chmod +x "$HELPER_SCRIPT"

          cat > "$DMG_STAGING/PETUNJUK_INSTALASI.txt" << 'EOF'
PANDUAN INSTALASI QUR'AN TARTEEL HIFZ DI MACOS:
================================================

PILIHAN 1 (Paling Mudah - 1 Klik Otomatis):
- Klik dua kali file "Buka Aplikasi (Klik Dua Kali).command" di jendela ini.
- Aplikasi akan otomatis disalin ke folder Applications, dibuka izin keamanannya, dan langsung dijalankan.

PILIHAN 2 (Drag and Drop Standar):
1. Tarik ikon "Qur'an Tarteel Hifz.app" ke folder shortcut "Applications".
2. Buka folder Applications di Finder Mac Anda.
3. Klik kanan (atau Control + Klik) pada "Qur'an Tarteel Hifz" -> klik "Open".
4. Saat muncul dialog konfirmasi pengembang, klik "Open" / "Buka Tetap".

PILIHAN 3 (Jika Menggunakan File .PKG Installer):
- Cukup klik dua kali file "QuranTarteelHifz-macOS-Universal.pkg".
- Ikuti panduan wizard instalasi macOS seperti aplikasi biasa hingga selesai.
EOF

          # 4. Bangun Image Disk .DMG Universal yang Rapi
          rm -f ../QuranTarteelHifz-macOS-Universal.dmg
          hdiutil create \
            -volname "Quran Tarteel Hifz" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "../QuranTarteelHifz-macOS-Universal.dmg"

          # 5. Bangun Native Apple Installer Package (.pkg) dengan Postinstall Unquarantine
          PKG_SCRIPTS_DIR="build/pkg_scripts"
          mkdir -p "$PKG_SCRIPTS_DIR"
          cat > "$PKG_SCRIPTS_DIR/postinstall" << 'EOF'
#!/bin/bash
APP_PATH="/Applications/Qur'an Tarteel Hifz.app"
if [ ! -d "$APP_PATH" ]; then
  APP_PATH=$(find /Applications -maxdepth 1 -name "*quran*tarteel*.app" -o -name "*Quran*Tarteel*.app" | head -n 1)
fi
if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
  xattr -cr "$APP_PATH" 2>/dev/null || true
fi
exit 0
EOF
          chmod +x "$PKG_SCRIPTS_DIR/postinstall"

          rm -f ../QuranTarteelHifz-macOS-Universal.pkg
          pkgbuild \
            --component "$APP_BUNDLE" \
            --install-location "/Applications" \
            --scripts "$PKG_SCRIPTS_DIR" \
            "../QuranTarteelHifz-macOS-Universal.pkg" || {
              echo "Peringatan: pkgbuild gagal, melanjutkan dengan DMG..."
            }

      - name: Unggah Artifact macOS DMG & PKG
        uses: actions/upload-artifact@v4
        with:
          name: QuranTarteelHifz-macOS-Installers
          path: |
            QuranTarteelHifz-macOS-Universal.dmg
            QuranTarteelHifz-macOS-Universal.pkg

  # ============================================================================
  # JOB 5: PUBLIKASI OTOMATIS KE GITHUB RELEASES (SAAT GIT TAG v*.*.* DIBUAT)
  # ============================================================================
  publish-release:
    name: 5. Publish GitHub Release
    needs: [ build-android, build-windows, build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unduh Seluruh Artifact Build (APK, ZIP Windows, & DMG macOS)
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Buat GitHub Release & Lampirkan File Installer
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/**/*.apk
            release_assets/**/*.zip
            release_assets/**/*.dmg
            release_assets/**/*.pkg

      - name: Kirim Otomatis ke Channel Telegram (program storage)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Mengirim notifikasi rilis $TAG_NAME ke channel Telegram..."

          # 1. Pesan Pengumuman Rilis
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=🚀 *Update Rilis Otomatis: Qur'an Tarteel Hifz ${TAG_NAME}*

Build terbaru telah selesai dikompilasi untuk Android, Windows Desktop, dan macOS (DMG & PKG Installer). File installer terlampir di bawah:" || true

          # 2. Unggah seluruh installer ke Telegram channel
          find release_assets -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.dmg" -o -name "*.pkg" \) | while read -r FILE; do
            BASENAME=$(basename "$FILE")
            echo "Mengunggah $BASENAME ke Telegram..."
            curl -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "caption=📦 *${BASENAME}* (Update ${TAG_NAME})" \
                 -F "parse_mode=Markdown" \
                 -F "document=@${FILE}" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" || true
          done
