name: quran_tarteel_hifz
description: >-
  Aplikasi Menghafal Al-Qur'an Lintas Platform (Android, Windows, macOS)
  dengan fitur Voice Hifz (Whisper AI), Radar Mutasyabihat 1 Juz Anti-Tertukar,
  Mushaf Madinah 15 Baris, dan Audio Murattal Koreksi Otomatis.
publish_to: 'none'
version: 1.3.1+16

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. Database SQLite Dual-Architecture (Android + Desktop Windows/macOS)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 2. Inferensi On-Device Whisper.cpp (FFI) & Cloud HTTP Client
  ffi: ^2.1.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Pendaftaran Aset Database Master Read-Only
  assets:
    - assets/db/quran_master.db
    - assets/fonts/

  fonts:
    - family: kfgqpc_hafs
      fonts:
        - asset: assets/fonts/kfgqpc_hafs.ttf
    - family: me_quran
      fonts:
        - asset: assets/fonts/me_quran.ttf
    - family: kitab
      fonts:
        - asset: assets/fonts/kitab.ttf
